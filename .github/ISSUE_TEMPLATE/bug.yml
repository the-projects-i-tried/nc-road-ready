name: App bug
description: Report a reproducible problem with the game or interface.
title: '[Bug] '
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the request or settings, expected result, and actual result. Do not include private session reports unless necessary.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser, device, and whether hosted or local
